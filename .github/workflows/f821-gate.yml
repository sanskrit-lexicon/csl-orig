# Undefined-name gate (F821) — H7243, 24-10-2026.
#
# Mirrors the pinned step in Uprava's .github/workflows/pr-guards.yml: ruff
# 0.16.5, F821 only, version pinned because the runner fleet does not
# guarantee ruff on PATH. Deliberately standalone so it does not depend on this
# repo's own ruff config or lint scope.
#
# Why the class needs a gate at all: H5715's refactor added MSK calls without
# imports across nine tools; a follow-up "insert missing imports" sweep fixed
# only what it found, nothing verified the sweep, and the breakage sat on main
# for three weeks while a money-path selftest stayed red. ruff.toml existed but
# no workflow invoked it.
#
# Negative control (H7243): a seeded undefined name on a scratch branch turned
# this job red — the gate is proven to fire, not just to exist.
name: F821 undefined names
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  undefined-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Undefined names (F821)
        run: |
          python -m pip install --quiet --disable-pip-version-check "ruff==0.16.5" || true
          python -m ruff check --select F821 --output-format=github .
