name: scorecard-weekly

# Weekly OSSF Scorecard for this public repo (E031 wave 4 / H8046).
# Calls the org reusable workflow; publish_results (OIDC) puts the result on
# the OpenSSF dashboard so this badge goes live:
#   https://api.scorecard.dev/projects/github.com/sanskrit-lexicon/csl-orig/badge
# Cadence matches ossf/scorecard's own weekly run (Saturdays 01:30 UTC).
# Permission shape obeys scorecard-action#workflow-restrictions: no workflow-
# level writes (the writes live on the reusable job, granted here).

on:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    uses: gasyoun/.github/.github/workflows/scorecard.yml@main
    permissions:
      contents: read
      security-events: write
      id-token: write
